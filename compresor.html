<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compresor de Imágenes Gratis</title>
<style>
body{margin:0;background:#0f0f0f;color:white;font-family:Arial;text-align:center;padding:20px}
.drop{border:2px dashed #666;border-radius:20px;padding:60px 20px;max-width:500px;margin:20px auto;cursor:pointer}
.btn{background:white;color:black;padding:13px 26px;border-radius:30px;border:none;font-weight:bold;cursor:pointer;text-decoration:none;display:inline-block}
#slider {width: 80%; max-width: 300px; margin: 15px auto;}
</style>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5464078310590974"
     crossorigin="anonymous"></script>
</head>
<body>
<br><a href="index.html" style="background:#222; color:white; padding:10px 20px; border-radius:20px; text-decoration:none; display:inline-block; font-size:14px;">← Volver al Menú Principal</a><br><br>

<h1>Compresor de Imágenes</h1>
<p style="color:#aaa">Reduce el peso de tus fotos sin perder calidad</p>

<div class="drop" id="zona">
<div style="font-size:50px">📉</div>
<b>Selecciona o arrastra tu imagen</b><br><br>
<label style="color:#aaa">Calidad: <span id="valCalidad">80</span>%</label><br>
<input type="range" id="slider" min="10" max="100" value="80"><br><br>
<button class="btn" id="boton">Elegir Foto</button>
<input type="file" id="input" accept="image/jpeg, image/png" hidden>
</div>

<div id="res" style="display:none">
<h3>¡Imagen Optimizada!</h3>
<p id="infoPeso" style="color:#7aff7a; font-weight:bold;"></p>
<br>
<a id="down" class="btn">Descargar Imagen</a>
<br><br>
<button class="btn" onclick="location.reload()" style="background:#333;color:white">Comprimir otra</button>
</div>

<script>
const input = document.getElementById('input');
const slider = document.getElementById('slider');
const valCalidad = document.getElementById('valCalidad');
const res = document.getElementById('res');
const down = document.getElementById('down');
const infoPeso = document.getElementById('infoPeso');

slider.oninput = () => valCalidad.innerText = slider.value;
document.getElementById('boton').onclick = () => input.click();
document.getElementById('zona').onclick = (e) => { if(e.target !== slider) input.click(); };

input.onchange = () => {
  const file = input.files[0];
  if(!file) return;
  
  const reader = new FileReader();
  reader.readAsDataURL(file);
  reader.onload = (event) => {
    const img = new Image();
    img.src = event.target.result;
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = img.width;
      canvas.height = img.height;
      ctx.drawImage(img, 0, 0);
      
      canvas.toBlob((blob) => {
        const url = URL.createObjectURL(blob);
        const pesoOriginal = (file.size / 1024).toFixed(1);
        const pesoFinal = (blob.size / 1024).toFixed(1);
        
        infoPeso.innerText = `Antes: ${pesoOriginal} KB | Ahora: ${pesoFinal} KB`;
        down.href = url;
        down.download = "optimizada_" + file.name;
        document.getElementById('zona').style.display = 'none';
        res.style.display = 'block';
      }, 'image/jpeg', slider.value / 100);
    };
  };
};
</script>
</body>
</html>
