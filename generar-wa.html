<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de Links de WhatsApp Gratis</title>
  
  <!-- CÓDIGO GOOGLE ADSENSE -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5464078310590974" crossorigin="anonymous"></script>

  <style>
    body { margin: 0; background: #0f0f0f; color: white; font-family: system-ui, sans-serif; padding: 20px; text-align: center; }
    .container { max-width: 500px; margin: 0 auto; background: #1a1a1a; padding: 25px; border-radius: 12px; border: 1px solid #333; }
    h1 { color: #25D366; font-size: 24px; margin-bottom: 10px; }
    p { color: #aaa; font-size: 14px; }
    label { display: block; text-align: left; margin: 15px 0 5px; color: #ddd; font-size: 14px; }
    input, textarea { width: 100%; padding: 12px; background: #252525; border: 1px solid #444; color: white; border-radius: 8px; box-sizing: border-box; font-size: 15px; }
    button { width: 100%; background: #25D366; color: black; font-weight: bold; border: none; padding: 14px; border-radius: 8px; margin-top: 20px; cursor: pointer; font-size: 16px; }
    button:hover { background: #20ba5a; }
    .result { margin-top: 20px; display: none; background: #111; padding: 15px; border-radius: 8px; border: 1px solid #25D366; word-break: break-all; }
    .btn-copy { background: #fff; color: #000; margin-top: 10px; padding: 10px; font-size: 14px; }
    .btn-back { display: inline-block; margin-top: 20px; color: #aaa; text-decoration: none; font-size: 14px; }
    .ads-space { background: #151515; border: 1px dashed #444; padding: 15px; margin: 20px 0; border-radius: 8px; color: #666; font-size: 12px; }
  </style>
</head>
<body>

  <!-- ESPACIO DE ANUNCIO SUPERIOR -->
  <div class="ads-space">[ Espacio para Anuncio de Google AdSense ]</div>

  <div class="container">
    <h1>Generador de Link WhatsApp 📲</h1>
    <p>Crea tu enlace directo con mensaje personalizado gratis.</p>

    <label for="phone">Número de WhatsApp (con código de país):</label>
    <input type="number" id="phone" placeholder="Ej: 521234567890 o 593991234567">

    <label for="message">Mensaje predeterminado (Opcional):</label>
    <textarea id="message" rows="3" placeholder="Ej: ¡Hola! Me interesa obtener más información."></textarea>

    <button onclick="generateLink()">Generar Enlace</button>

    <div id="resultBox" class="result">
      <p style="color:#25D366; margin:0 0 10px;">¡Tu enlace está listo!</p>
      <input type="text" id="finalLink" readonly>
      <button class="btn-copy" onclick="copyLink()">Copiar Enlace</button>
    </div>

    <a href="index.html" class="btn-back">← Volver al menú principal</a>
  </div>

  <!-- ESPACIO DE ANUNCIO INFERIOR -->
  <div class="ads-space">[ Espacio para Anuncio de Google AdSense ]</div>

  <script>
    function generateLink() {
      const phone = document.getElementById('phone').value.trim();
      const message = document.getElementById('message').value.trim();
      
      if (!phone) {
        alert("Por favor ingresa un número de teléfono.");
        return;
      }

      let url = `https://wa.me/${phone}`;
      if (message) {
        url += `?text=${encodeURIComponent(message)}`;
      }

      document.getElementById('finalLink').value = url;
      document.getElementById('resultBox').style.display = 'block';
    }

    function copyLink() {
      const copyText = document.getElementById("finalLink");
      copyText.select();
      copyText.setSelectionRange(0, 99999);
      navigator.clipboard.writeText(copyText.value);
      alert("¡Enlace copiado al portapapeles!");
    }
  </script>
</body>
</html>
